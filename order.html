<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">หน้าแรก</a>
      <a href="order.html" class="active">สั่งซื้อ</a>
    </nav>
  </header>

  <main class="container">
    <section class="order-section">
      <h1>แบบฟอร์มสั่งซื้อ</h1>
      <p class="subtitle">กรอกรายละเอียดด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>

      <form id="orderForm" class="order-form">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="4" placeholder="ระบุสินค้าและจำนวน" required></textarea>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" step="any" placeholder="0" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3" placeholder="ข้อความเพิ่มเติม (ถ้ามี)"></textarea>
        </div>

        <button type="submit" class="btn">ยืนยันสั่งซื้อ</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 สงวนลิขสิทธิ์</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
